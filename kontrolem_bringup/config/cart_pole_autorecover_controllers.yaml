# controller_manager config for the AUTOMATIC recovery (round-trip) demo.
#
# Same setup as the auto fail-forward demo (LQR primary + MPC fallback, a shove a
# few seconds in trips LQR -> the Supervisor fails over to MPC), but auto_recover is
# ALSO on: after MPC rides out the disturbance and the state settles back inside
# LQR's trust region, the Supervisor SHADOW-evaluates the dormant LQR and, once it
# has been healthy for `recover_dwell` ticks, hands BACK to it (bumplessly, blended).
# The control_law field thus goes lqr -> mpc -> lqr with no human command.
controller_manager:
  ros__parameters:
    update_rate: 200  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    kontrolem_controller:
      type: kontrolem_ros2_control/KontrolemController

kontrolem_controller:
  ros__parameters:
    control_laws: ["lqr", "mpc"]   # lqr primary, mpc fallback (chain order)
    auto_fallback: true            # fail over on lost trust
    fallback_dwell: 1              # fail over on the first not-ok tick (clean, low-noise sim)
    auto_recover: true             # switch BACK to the primary once it's trustworthy again
    recover_dwell: 60              # ~0.3 s of sustained LQR health before the switch-back
    switch_blend_ticks: 20
    actuated_joints: ["cart_joint"]
    command_interface: effort
    state_position_interface: position
    state_velocity_interface: velocity

    q_ref: [0.0, 0.0]
    v_ref: [0.0, 0.0]
    safe_action: zero
    publish_diagnostics: true      # diagnostics.control_law shows lqr->mpc->lqr live

    # LQR primary with a MODEST validity region so the shove leaves it.
    lqr.q_diag: [1.0, 10.0, 1.0, 1.0]
    lqr.r_diag: [0.1]
    lqr.q_dev_max: 0.15

    # MPC fallback (loose torque limit so it can absorb the disturbance).
    mpc.q_diag: [1.0, 10.0, 1.0, 1.0]
    mpc.r_diag: [0.1]
    mpc.horizon: 30
    mpc.dt_mpc: 0.02
    mpc.tau_max: 100.0
