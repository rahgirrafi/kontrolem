# M14 — Example B: the Go2 trots with the WHOLE-BODY QP (control_law: wbc). SAME robot, SAME Gazebo
# world, SAME diagonal TrotGait as the model-free kinematic trot (go2_trot_kinematic.yaml) — but a
# structurally different controller: an inverse-dynamics QP with contact constraints, friction cones,
# torque limits and full floating-base dynamics, closed-loop on the base (ground truth, then the
# InEKF estimate). A user swaps ONE line — kinematic_gait <-> wbc — and watches the same robot walk
# the same gait two different ways. Behaviourally this is the crawl demo with CrawlGait->TrotGait
# (the static weight-shift deleted): the two grounded diagonal feet are the support, the two flight
# feet track their swing arc, the base task holds nominal and glides forward. Offline-proven feasible
# on two diagonal feet (test_wbc_trot). The estimator rides along, so it also runs on the estimate.
controller_manager:
  ros__parameters:
    update_rate: 500

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    kontrolem_controller:
      type: kontrolem_ros2_control/KontrolemController

    base_estimator:
      type: kontrolem_ros2_control/BaseEstimatorController

kontrolem_controller:
  ros__parameters:
    control_law: wbc
    base_type: floating
    command_interface: effort
    state_position_interface: position
    state_velocity_interface: velocity
    safe_action: zero
    publish_diagnostics: true
    publish_planned_contact: true
    planned_contact_topic: /planned_contact

    actuated_joints:
      - FL_hip_joint
      - FL_thigh_joint
      - FL_calf_joint
      - FR_hip_joint
      - FR_thigh_joint
      - FR_calf_joint
      - RL_hip_joint
      - RL_thigh_joint
      - RL_calf_joint
      - RR_hip_joint
      - RR_thigh_joint
      - RR_calf_joint
    contact_frames: [FL_foot, FR_foot, RL_foot, RR_foot]
    base_gpio: floating_base
    contact_gpio: contact

    wbc.base_height: 0.2868
    wbc.nominal_posture: [0.0, 0.9, -1.8, 0.0, 0.9, -1.8, 0.0, 0.9, -1.8, 0.0, 0.9, -1.8]

    # Dynamic diagonal TROT (the M13 TrotGait; SAME gait as go2_trot_kinematic.yaml). swing_pair
    # groups the feet (contact-frame order FL,FR,RL,RR) into the two diagonals {FL,RR}=0 and
    # {FR,RL}=1; each swings once per stride, 180 deg out of phase. duty < 1 leaves an all-four-
    # stance bracket around each swing, so there is never a flight phase (>=2 feet down) — the
    # quasi-static trot the offline gate validated (test_wbc_trot). The base is held at nominal (NO
    # weight-shift) and glides forward at step_len/period, with the matching velocity feedforward.
    reference_type: trot
    gait.swing_pair: [0, 1, 1, 0]
    gait.period: 1.0
    gait.duty: 0.5
    gait.step_len: 0.06
    gait.step_h: 0.05
    gait.start_delay: 6.0   # hold nominal until well after the startup weld is released

    # QP task gains. kp_post = 0: posture is a pure damping regularizer so a swing leg is free to
    # follow its arc; the swing task (kp_swing/kd_swing) tracks the flight feet, the base task
    # (kp_base/kd_base, stiff) holds the trunk upright and glides it forward over the two diagonals.
    wbc.kp_base: 100.0
    wbc.kd_base: 20.0
    wbc.kp_post: 0.0
    wbc.kd_post: 5.0
    wbc.w_base: 100.0
    wbc.w_post: 1.0
    wbc.w_force: 0.0001
    wbc.w_tau: 0.0001
    wbc.mu: 0.5
    wbc.tau_max: 23.7
    wbc.kp_swing: 400.0
    wbc.kd_swing: 40.0

base_estimator:
  ros__parameters:
    actuated_joints:
      - FL_hip_joint
      - FL_thigh_joint
      - FL_calf_joint
      - FR_hip_joint
      - FR_thigh_joint
      - FR_calf_joint
      - RL_hip_joint
      - RL_thigh_joint
      - RL_calf_joint
      - RR_hip_joint
      - RR_thigh_joint
      - RR_calf_joint
    contact_gpio: contact
    contact_frames: [FL_foot, FR_foot, RL_foot, RR_foot]
    imu_topic: /imu/data
    odom_topic: /base_odom
    use_planned_contact: true
    planned_contact_topic: /planned_contact
    odom_frame: world
    base_frame: base
    base_height: 0.2868
    gravity: 9.81
    k_grav: 0.0
    k_vel: 1.0
    k_pos: 0.3
    accel_gate: 0.5
    gyro_gate: 0.5
    innov_max: 0.15
    flat_ground: true
    # InEKF tuning for the closed-loop trot (used when estimator_type:=inekf):
    inekf.sigma_gyro: 0.005
    inekf.sigma_accel: 0.5
    inekf.sigma_fk: 0.02
    inekf.sigma_contact: 0.001
    inekf.sigma_grav: 1000000.0
